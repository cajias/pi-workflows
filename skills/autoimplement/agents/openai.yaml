interface:
  display_name: "Autoimplement"
  short_description: "Finish a plan and ready its pull request or merge request"
  default_prompt: >-
    Use $autoimplement to implement the approved plan end-to-end, test it, run
    `pi-reviewer --base <branch>` until no P0/P1 findings remain, clear valid
    pull request or merge request feedback, and confirm CI/CD is green without
    merging.
